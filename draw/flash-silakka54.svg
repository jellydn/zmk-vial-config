<text x='24.0' y='500.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#24292f' text-anchor='start'>With the BOOT button: unplug USB, then TRRS. Hold BOOT and plug in that half (or hold BOOT, press RESET).</text>
<text x='24.0' y='522.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#8250df' text-anchor='start'>Without it (purple; keep the TRRS cable connected, USB in the half you flash):</text>
<text x='40.0' y='542.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#8250df' text-anchor='start'>right half: move the USB cable to the RIGHT half, hold Nav (Space), tap the right Ldr key, type B O O T</text>
<text x='40.0' y='562.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#8250df' text-anchor='start'>left half: USB in the left half, hold Num (Bksp) or Sym (Enter), tap the left Ldr key, type B O O T</text>
<text x='24.0' y='584.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#24292f' text-anchor='start'>The half opens as RPI-RP2: copy silakka54-zmk-left.uf2 or silakka54-zmk-right.uf2 to it.</text>
