# This file generates the GitHub Actions matrix. Each entry builds one
# firmware file (.uf2). Board revisions use ZMK's `name@rev//zmk` syntax.
---
include:
  # Silakka54: onboard RP2040, wired split (full-duplex UART over TRRS)
  # artifact-name sets the .uf2 name (silakka54-zmk-left.uf2, silakka54-zmk-right.uf2).
  - board: rpi_pico//zmk
    shield: silakka54_left
    artifact-name: silakka54-zmk-left
  - board: rpi_pico//zmk
    shield: silakka54_right
    artifact-name: silakka54-zmk-right
