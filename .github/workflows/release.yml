name: Release firmware
# Builds every firmware on each push to main and publishes it as the rolling
# "latest" release. Pull requests that change this file run the builds and the
# collect step, but do not publish.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

# Two quick merges must not delete and recreate the release at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zmk:
    uses: ./.github/workflows/build-nix.yml

  release:
    needs: [zmk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir release
          find artifacts -type f -name '*.uf2' -exec cp {} release/ \;
          cp qmk/*.vil draw/*.svg release/
          ls -l release
          test "$(ls release/*.uf2 | wc -l)" -eq 2 # ZMK left + right

      - name: Publish the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The stock Vial firmware each .vil was checked against.
          SILAKKA54_UF2_URL: https://github.com/Squalius-cephalus/silakka54/releases/download/v1.4led/silakka54_vial_led_LEFT.uf2
          CORNE_UF2_URL: https://github.com/foostan/kbd_firmware/raw/7e94242f7474761609d7ec16df0872a9785c2ccb/keyboards/crkbd/vial-kb/vial-qmk/.build/crkbd_rev4_1_standard_vial.uf2
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest release/* --target "$GITHUB_SHA" --title "Firmware ($(date -u +%F), ${GITHUB_SHA::7})" --notes "All firmware built from ${GITHUB_SHA}. See the README for how to flash. Load the .vil in Vial after every Vial flash.

          Silakka54 Vial: flash Squalius-cephalus' v1.4led firmware ($SILAKKA54_UF2_URL) on both halves, then load silakka54-graphite.vil.

          Corne v4.1: flash foostan's stock Vial firmware ($CORNE_UF2_URL), then load corne-v4.1-graphite.vil."
