name: Build Silakka54 Vial firmware
on:
  workflow_dispatch:
  workflow_call: # used by release.yml
  push:
    paths:
      - qmk/silakka54/**
      - qmk/silakka54-graphite.vil
      - .github/workflows/build-qmk-silakka54.yml
  pull_request:
    paths:
      - qmk/silakka54/**
      - qmk/silakka54-graphite.vil
      - .github/workflows/build-qmk-silakka54.yml

permissions:
  contents: read

# vial-qmk ships the Silakka54 keyboard definition; same revision as foostan's
# Corne v4.1 Vial firmware (foostan/kbd_firmware pins it too).
env:
  VIAL_QMK_REF: dd43959ae5c08d8a28d38a1acf7b04e86b14a344

jobs:
  build:
    name: Build Silakka54 Vial firmware
    runs-on: ubuntu-latest
    # A normal build takes about 2 minutes; fail fast if apt or pip hangs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: vial-kb/vial-qmk
          ref: ${{ env.VIAL_QMK_REF }}
          path: vial-qmk
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          pip install qmk -r vial-qmk/requirements.txt

      - name: Add keymap
        run: cp -r qmk/silakka54 vial-qmk/keyboards/silakka54/keymaps/jellydn

      - name: Build
        working-directory: vial-qmk
        env:
          QMK_HOME: ${{ github.workspace }}/vial-qmk
        run: qmk compile -kb silakka54 -km jellydn

      # qmk compile also copies the .uf2 to the vial-qmk root; upload-artifact
      # skips the hidden .build/ folder. One .uf2 for both halves. QMK names it
      # after the keymap (silakka54_jellydn), so give it the same style of name
      # as the ZMK files (silakka54-zmk-left.uf2).
      - name: Collect firmware
        run: |
          mkdir firmware
          cp vial-qmk/silakka54_jellydn.uf2 firmware/silakka54-vial.uf2
          cp qmk/silakka54-graphite.vil firmware/

      - uses: actions/upload-artifact@v7
        with:
          name: silakka54-vial
          path: firmware/
          if-no-files-found: error
